name: LogicLoop
description: 'LogicLoop was a low-code / no-code operations-automation platform that let non-engineering
  teams write SQL-based business rules on top of their company data to trigger alerts, reviews, and
  automated actions for use cases like fraud and risk monitoring, logistics, and customer onboarding.
  Founded in 2021 by Jesika Haria and Jackie Xu, it raised roughly $4.5M from Accel and First Round
  Capital, offered an AI SQL Copilot (plain-English-to-SQL) and a REST API for managing rules,
  schedules, notifications, and embedded dashboards. LogicLoop was acquired by Hummingbird (risk and
  compliance) on 2024-09-18; its website (www.logicloop.com), docs (docs.logicloop.com), and API hosts
  no longer resolve, so no live API surface remains to enrich.'
